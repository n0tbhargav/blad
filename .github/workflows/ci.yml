name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Archives must be identical whoever built them, so treat warnings as errors
  # rather than letting portability rot accumulate on targets nobody develops on.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # libjxl is compiled from source on a cold cache; the runners are smaller than
    # a dev machine, so give the first build room.
    timeout-minutes: 45
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-aarch64, os: macos-latest }
          - { name: macos-x86_64, os: macos-13 }
          # Never built on Windows. Allowed to fail until it has passed once,
          # so a known-unknown does not read as a regression.
          - { name: windows-x86_64, os: windows-latest, experimental: true }

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Keyed on the lockfile, so the vendored libjxl build is paid for once per
      # dependency change instead of once per push.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build
        run: cargo build --workspace --release

      - name: Test
        run: cargo test --workspace --release

      # Proves the shipped binary runs at all, and that the vendored codec linked
      # correctly — a static-link failure otherwise only shows up in someone's hands.
      - name: Smoke
        run: cargo run --release --bin blad -- --version

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
