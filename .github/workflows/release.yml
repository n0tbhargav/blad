name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Windows has not yet passed CI. A missing Windows asset is better than a
    # release that fails to publish for the four platforms that do work.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-13 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, experimental: true }

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --bin blad --target ${{ matrix.target }}

      # An archival tool that shipped a binary it had never run would be absurd.
      - name: Smoke
        run: cargo test --release --workspace --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="blad-${GITHUB_REF_NAME:-${{ inputs.tag }}}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/blad" "dist/$name/"
          cp README.md LICENSE-APACHE LICENSE-MIT "dist/$name/" 2>/dev/null || \
            cp README.md "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "${{ inputs.tag }}" }
          $name = "blad-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/blad.exe" "dist/$name/"
          Copy-Item README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force "dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    # `always()` so the release still publishes when the experimental Windows
    # leg fails; the four required targets are enforced below.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # blad exists to prove bytes are what they claim to be. Shipping it without
      # checksums would contradict the product.
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          ls -la
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                   aarch64-apple-darwin x86_64-apple-darwin; do
            ls *"$t"* >/dev/null || { echo "missing required target $t"; exit 1; }
          done
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          # 0.0.x. The archive format is not frozen; see the README.
          prerelease: true
          generate_release_notes: true
